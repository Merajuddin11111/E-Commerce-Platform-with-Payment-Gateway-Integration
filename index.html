<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMK Store - E-Commerce Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">AMK Store</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Premium Electronics & Gadgets</h1>
        <p>Explore top deals with secure payment integration</p>
    </section>

    <main class="products-container">
        <h2>Featured Products</h2>
        
        <div class="product-grid">
            <div class="product-card">
                <div class="product-img-placeholder">🎧</div>
                <h3>Wireless Headphones</h3>
                <p class="price">$39.99</p>
                <button class="buy-btn" onclick="initiatePayment(39.99)">Buy Now</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
